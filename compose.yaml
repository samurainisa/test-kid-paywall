services:
  paywall:
    build: .
    ports:
      - "3000:3000"
    environment:
      SQLITE_PATH: /data/paywall.sqlite
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
    volumes:
      - paywall-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  paywall-data:
